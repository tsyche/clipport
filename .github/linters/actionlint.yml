---
# Config for actionlint. Super-linter resolves it as
# ${GITHUB_WORKSPACE}/${LINTER_RULES_PATH}/actionlint.yml with LINTER_RULES_PATH
# defaulting to .github/linters (same dir as .jscpd.json) — hence this file's
# location. Local `just lintci` passes the same path via -config-file.
#
# The pinned super-linter's actionlint (v1.7.1) ships a runner-label list that
# predates ubuntu-26.04, so the label check needs the extra entry — declare it
# here. actionlint only offers the self-hosted labels list as an extension
# point for runner labels; the label itself is GitHub-hosted.
self-hosted-runner:
  labels:
    - ubuntu-26.04
