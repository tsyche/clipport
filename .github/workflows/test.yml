name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the in-flight run; pushes to other
# refs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

  fuzz:
    name: Fuzz MonitorSentClips (60s)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Seed corpus already runs in the test job; this exercises the actual
      # fuzzing loop to catch decode regressions the static seeds miss.
      - name: Fuzz MonitorSentClips
        run: go test -race -run=^$ -fuzz=FuzzMonitorSentClips -fuzztime=60s .

      # A crasher is written to testdata/fuzz/… in the runner workspace,
      # which is discarded with the job. Keep it so the corpus can be
      # committed and the bug reproduced locally.
      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14
