name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # macOS race builds can abort with "missing LC_UUID load command" on
      # hosted runners (ld64/race interaction); run without -race there.
      - name: Run tests
        if: runner.os != 'macOS'
        run: go test -race ./...

      - name: Run tests (macOS, no race)
        if: runner.os == 'macOS'
        run: go test ./...
